[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "beatstoch"
version = "1.6.1"
description = "BPM-aware stochastic drum generator: library + CLI."
authors = [{ name = "James Campbell" }]
maintainers = [{ name = "James Campbell" }]
readme = "README.md"
license = "Unlicense"
requires-python = ">=3.10"
keywords = [
    "midi",
    "drums",
    "music",
    "bpm",
    "stochastic",
    "algorithmic",
    "composition",
    "audio",
    "cli",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "License :: Public Domain",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Multimedia :: Sound/Audio :: MIDI",
    "Topic :: Artistic Software",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "mido>=1.3.0",
    "numpy>=1.24.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[project.urls]
Homepage = "https://github.com/james-see/beatstoch"
Repository = "https://github.com/james-see/beatstoch"
Documentation = "https://james-see.github.io/beatstoch/"
Source = "https://github.com/james-see/beatstoch"
Tracker = "https://github.com/james-see/beatstoch/issues"

[project.scripts]
beatstoch = "beatstoch.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/beatstoch"]

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
addopts = "-q"
